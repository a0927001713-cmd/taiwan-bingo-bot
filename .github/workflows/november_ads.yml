name: November Telegram Ads

on:
  workflow_dispatch:
  schedule:
    # 台灣／北京時間每天六次
    - cron: '0 1,4,7,10,14,16 * 11 *'

jobs:
  november-ads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send November Telegram ads
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADS_CHAT_ID: ${{ secrets.TELEGRAM_ADS_CHAT_ID }}
        run: python november_ads.py


