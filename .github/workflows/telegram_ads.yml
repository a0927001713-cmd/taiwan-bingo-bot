
name: Telegram Ads

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2,8,14 * * *'

jobs:
  send-ads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send Telegram ads
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADS_CHAT_ID: ${{ secrets.TELEGRAM_ADS_CHAT_ID }}
        run: python telegram_ads.py
