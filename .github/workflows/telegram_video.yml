
name: Telegram Video

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 09:00、15:00、20:00
    - cron: '0 1,7,12 * * *'

jobs:
  send-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send Telegram video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADS_CHAT_ID: ${{ secrets.TELEGRAM_ADS_CHAT_ID }}
        run: python telegram_video.py

